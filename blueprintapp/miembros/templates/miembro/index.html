{% extends 'base.html' %}


{% block content %}
<div class="container">
    <h2>Miembros</h2>
    <a href="{{ url_for('bp_miembro.create') }}" class="btn btn-primary mb-3">Nuevo Miembro</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
            </tr>
        </thead>
        <tbody>
            {% for miembro in miembros %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ miembro.id }}</td>
                <td>{{ miembro.nombre }}</td>
                <td>{{ miembro.email }}</td>
                <td>
                    <a href="{{ url_for('bp_miembro.edit', id=miembro.id) }}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{{ url_for('bp_miembro.delete', id=miembro.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Estás seguro de eliminar ?')">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
