
{% extends 'base.html' %}


{% block content %}
<div class="container">
    <h2>Miembros</h2>
    <a href="{{ url_for('bp_tarea.create') }}" class="btn btn-primary mb-3">Nueva tarea</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>ID</th>
                <th>Descipcion</th>
                <th>Completado</th>
            </tr>
        </thead>
        <tbody>
            {% for tarea in tareas %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ tarea.id }}</td>
                <td>{{ tarea.descripcion }}</td>
                <td>{{ tarea.completado }}</td>
                <td>
                    <a href="{{ url_for('bp_tarea.edit', id=tarea.id)}}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{{url_for('bp_tarea.delete', id=tarea.id)}}" class="btn btn-sm btn-danger" onclick="return confirm('Estás seguro de eliminar ?')">Eliminar</a>
                </td>
            </tr>
            {% else %}
            <h2>No hay Tareas</h2>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
