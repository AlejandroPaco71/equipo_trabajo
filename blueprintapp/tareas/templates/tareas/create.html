
{% extends 'base.html' %}

{% block content %}

<h1>CREAR MIEMBRO </h1>

<form action="{{ url_for('bp_tarea.create') }}" method="POST">



    <div class="mb-3">
        <label for="" class="form-label">Descipcion</label>
        <input type="text" class="form-control" placeholder="Describe la tarea" name="descripcion" required>
    </div>

    <div class="mb-3">
        <label for="" class="form-label">Completado</label>
        <input type="checkbox" class="form-check-input"  name="completado" >
    </div>

    <button type="submit" class="btn btn-primary">Registrar Tarea</button>
    <a class="btn btn-secondary" href="{{ url_for('bp_tarea.index' )}}">Cancelar</a>

</form>

{% endblock %}
